<div class="container-fluid py-4">
  <h1 class="h2 fw-bold mb-1">Dashboard</h1>
  <p class="text-muted mb-4">Review spending totals across expense categories.</p>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted mt-2">Loading spending summary...</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
    <div>{{ errorMessage }}</div>
  </div>

  <section
    *ngIf="!isLoading && !errorMessage"
    class="row g-3"
    aria-label="Spending summary"
  >
    <div *ngFor="let summary of spendingSummary" class="col-12 col-md-6 col-xl-4">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <p class="text-muted mb-1">{{ summary.categoryName }}</p>
              <p class="fs-4 fw-bold mb-0">${{ summary.totalAmount | number:'1.2-2' }}</p>
            </div>
            <span class="badge text-bg-light">{{ summary.expenseCount }} records</span>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="spendingSummary.length === 0" class="col-12">
      <div class="card shadow-sm">
        <div class="card-body py-5 text-center text-muted">
          No spending summary is available.
        </div>
      </div>
    </div>
  </section>
</div>
