<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h2 fw-bold mb-1">{{ pageTitle }}</h1>
      <p class="text-muted mb-0">{{ pageDescription }}</p>
    </div>
    <button class="btn btn-outline-secondary" type="button" (click)="goBack()">
      <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>
      Back to Expenses
    </button>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted mt-2">Loading expense details...</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
    <i class="bi bi-exclamation-triangle-fill fs-5" aria-hidden="true"></i>
    <div>{{ errorMessage }}</div>
  </div>

  <form *ngIf="!isLoading && !errorMessage" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="row g-4">
          <div class="col-12">
            <label class="form-label" for="title">Title <span *ngIf="!isReadOnly" class="text-danger">*</span></label>
            <input id="title" class="form-control" type="text" formControlName="title" maxlength="200" [readonly]="isReadOnly" />
            <div *ngIf="form.controls.title.invalid && form.controls.title.touched" class="invalid-feedback d-block">
              Enter an expense title.
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="category">Category <span *ngIf="!isReadOnly" class="text-danger">*</span></label>
            <select id="category" class="form-select" formControlName="categoryId" (change)="onCategoryChange()">
              <option [ngValue]="null">Select a category</option>
              <option *ngFor="let category of categoryOptions" [ngValue]="category.id">{{ category.name }}</option>
            </select>
            <div *ngIf="form.controls.categoryId.invalid && form.controls.categoryId.touched" class="invalid-feedback d-block">
              Select a category.
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="subCategory">Subcategory <span *ngIf="!isReadOnly" class="text-danger">*</span></label>
            <select id="subCategory" class="form-select" formControlName="subCategoryId">
              <option [ngValue]="null">Select a subcategory</option>
              <option *ngFor="let subCategory of subCategoryOptions" [ngValue]="subCategory.subCategoryId">
                {{ subCategory.subCategoryName }}
              </option>
            </select>
            <div *ngIf="form.controls.subCategoryId.invalid && form.controls.subCategoryId.touched" class="invalid-feedback d-block">
              Select a subcategory.
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="amount">Amount <span *ngIf="!isReadOnly" class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input id="amount" class="form-control" type="number" formControlName="amount" min="0.01" step="0.01" [readonly]="isReadOnly" />
            </div>
            <div *ngIf="form.controls.amount.invalid && form.controls.amount.touched" class="invalid-feedback d-block">
              Enter an amount greater than zero.
            </div>
          </div>

          <div class="col-md-6">
            <label class="form-label" for="expenseDate">Expense Date <span *ngIf="!isReadOnly" class="text-danger">*</span></label>
            <input id="expenseDate" class="form-control" type="date" formControlName="expenseDate" [readonly]="isReadOnly" />
            <div *ngIf="form.controls.expenseDate.invalid && form.controls.expenseDate.touched" class="invalid-feedback d-block">
              Select the expense date.
            </div>
          </div>

          <div class="col-12">
            <label class="form-label" for="notes">Notes</label>
            <textarea id="notes" class="form-control" rows="4" formControlName="notes" maxlength="1000" [readonly]="isReadOnly"></textarea>
          </div>
        </div>
      </div>

      <div *ngIf="!isReadOnly" class="card-footer d-flex justify-content-end gap-2">
        <button class="btn btn-light" type="button" [disabled]="isSaving" (click)="goBack()">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="isSaving">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
          {{ mode === 'create' ? 'Add Expense' : 'Save Changes' }}
        </button>
      </div>
    </div>
  </form>
</div>
