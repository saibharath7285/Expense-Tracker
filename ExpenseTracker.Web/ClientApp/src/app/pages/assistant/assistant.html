<div class="assistant-page">
  <header class="assistant-header d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div>
      <h1 class="h3 fw-bold mb-1">Expense Assistant</h1>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-outline-secondary"
        type="button"
        [disabled]="isCopilotLoading || copilotMessages.length === 0"
        (click)="clearCopilotMessages()"
      >
        Clear Chat
      </button>
    </div>
  </header>

  <!-- ============================================== -->
  <!-- AI ASSISTANT CHAT                              -->
  <!-- ============================================== -->
  <section class="copilot-full-container card shadow-sm mt-3">
    <!-- Chat Messages Stream -->
    <div #copilotMessageContainer class="copilot-stream p-4" aria-live="polite">
      <!-- Welcome Empty State -->
      <div *ngIf="copilotMessages.length === 0" class="welcome-box text-center py-5">
        <div class="avatar-circle mx-auto mb-3">
          <i class="bi bi-stars fs-1 text-primary"></i>
        </div>
        <h4 class="fw-bold mb-2">Welcome to your Expense Assistant</h4>
        <p class="text-muted mx-auto mb-4" style="max-width: 520px;">
          Ask any question about your spending, categories, or recent transactions in natural language.
        </p>

        <div class="quick-prompts-row d-flex flex-wrap justify-content-center gap-2">
          <button
            *ngFor="let prompt of quickPrompts"
            type="button"
            class="btn btn-outline-primary btn-sm rounded-pill px-3 py-2"
            (click)="sendQuickPrompt(prompt)"
          >
            {{ prompt }}
          </button>
        </div>
      </div>

      <!-- Messages Feed -->
      <div class="d-flex flex-column gap-3">
        <article
          *ngFor="let msg of copilotMessages"
          class="chat-bubble"
          [class.bubble-user]="msg.role === 'user'"
          [class.bubble-assistant]="msg.role === 'assistant'"
          [class.bubble-error]="msg.role === 'error'"
        >
          <!-- User Bubble -->
          <div *ngIf="msg.role === 'user'" class="bubble-content bg-primary text-white p-3 rounded-4 shadow-sm">
            <p class="mb-0 text-break">{{ msg.content }}</p>
          </div>

          <!-- Assistant Bubble -->
          <div *ngIf="msg.role === 'assistant'" class="bubble-content bg-light border p-3 rounded-4 shadow-sm">
            <div class="mb-0 text-break assistant-text" [innerHTML]="msg.content | assistantMarkdown"></div>
          </div>

          <!-- Error Bubble -->
          <div *ngIf="msg.role === 'error'" class="bubble-content bg-danger-subtle text-danger border border-danger-subtle p-3 rounded-4 shadow-sm">
            <div class="d-flex align-items-center gap-2 mb-1">
              <i class="bi bi-exclamation-triangle-fill fs-5"></i>
              <span class="fw-bold">Notice</span>
            </div>
            <p class="mb-0 text-break">{{ msg.content }}</p>
          </div>
        </article>

        <!-- Loading Card -->
        <article *ngIf="isCopilotLoading" class="chat-bubble bubble-assistant">
          <div class="bubble-content bg-light border p-3 rounded-4 shadow-sm d-flex align-items-center gap-3">
            <div class="spinner-border spinner-border-sm text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <span class="text-muted">Thinking...</span>
          </div>
        </article>
      </div>
    </div>

    <!-- Input Footer -->
    <div class="copilot-input-bar card-footer p-3 bg-white border-top">
      <form (ngSubmit)="sendCopilotMessage()" class="d-flex gap-2">
        <input
          type="text"
          class="form-control form-control-lg fs-6"
          placeholder="Ask a question or request an action (e.g. 'What is my total spending this month?')..."
          [(ngModel)]="copilotInput"
          name="fullCopilotInput"
          [disabled]="isCopilotLoading"
          autocomplete="off"
        />
        <button
          type="submit"
          class="btn btn-primary px-4 d-flex align-items-center gap-2"
          [disabled]="!copilotInput.trim() || isCopilotLoading"
        >
          <span>Send</span>
          <i class="bi bi-send-fill"></i>
        </button>
      </form>
    </div>
  </section>
</div>
